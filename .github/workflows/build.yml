name: Build SVED APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Compile and Package APK
        run: |
          BUILD_TOOLS=$(ls -d /usr/local/lib/android/sdk/build-tools/* | tail -n 1)
          PLATFORM=/usr/local/lib/android/sdk/platforms/android-33/android.jar

          mkdir -p build/gen build/obj build/apk
          "$BUILD_TOOLS/aapt" package -f -m -J build/gen -S res -M AndroidManifest.xml -I "$PLATFORM"
          javac -source 1.8 -target 1.8 -bootclasspath "$PLATFORM" -classpath "$PLATFORM" -d build/obj build/gen/ru/sved/sterzhen/R.java src/ru/sved/sterzhen/MainActivity.java
          "$BUILD_TOOLS/d8" --lib "$PLATFORM" --output build/apk/ build/obj/ru/sved/sterzhen/*.class
          "$BUILD_TOOLS/aapt" package -f -M AndroidManifest.xml -S res -A assets -I "$PLATFORM" -F build/sved_unsigned.apk build/apk/
          "$BUILD_TOOLS/zipalign" -f -p 4 build/sved_unsigned.apk build/sved_aligned.apk

          keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=SVED,O=Sterzhen,C=RU"
          "$BUILD_TOOLS/apksigner" sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android --out sved-sterzhen.apk build/sved_aligned.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sved-sterzhen-apk
          path: sved-sterzhen.apk
