name: Build SVED APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Compile APK
        run: |
          SDK="/usr/local/lib/android/sdk"
          BT=$(ls -d $SDK/build-tools/* | tail -n 1)
          PL=$(ls -d $SDK/platforms/android-* | tail -n 1)/android.jar
          mkdir -p build/gen build/obj build/apk
          "$BT/aapt" package -f -m -J build/gen -S res -M AndroidManifest.xml -I "$PL"
          javac -encoding UTF-8 -source 1.8 -target 1.8 -bootclasspath "$PL" -classpath "$PL" -d build/obj build/gen/ru/sved/sterzhen/R.java src/ru/sved/sterzhen/MainActivity.java
          "$BT/d8" --lib "$PL" --output build/apk/ build/obj/ru/sved/sterzhen/*.class
          "$BT/aapt" package -f -M AndroidManifest.xml -S res -A assets -I "$PL" -F build/u.apk build/apk/
          "$BT/zipalign" -f -p 4 build/u.apk build/a.apk
          keytool -genkeypair -v -keystore debug.keystore -storepass android -alias a -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=SVED,O=S,C=RU"
          "$BT/apksigner" sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android --out sved-sterzhen.apk build/a.apk
      - uses: actions/upload-artifact@v4
        with:
          name: sved-sterzhen-apk
          path: sved-sterzhen.apk
