<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>АВТО-ОПТИКА OUKITEL G1</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none}
body{background:#0d1117;color:#fff;font-family:sans-serif;display:flex;flex-direction:column;height:100vh;overflow:hidden}
.top{background:#161b22;padding:10px;text-align:center;border-bottom:2px solid #00e676}
.top h1{font-size:15px;color:#00e676}
.top p{font-size:11px;color:#8b949e;margin-top:2px}
.scr{flex:1;background:#000;position:relative;display:flex;justify-content:center;align-items:center;overflow:hidden}
video{display:none}
canvas{max-width:100%;max-height:100%;object-fit:contain}
.tel{background:#161b22;padding:6px 10px;border-top:1px solid #30363d;display:flex;justify-content:space-around;font-size:11px;color:#8b949e;text-align:center}
.tel b{color:#00e676;display:block;font-size:12px}
.ctrl{background:#0d1117;padding:10px;display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:8px}
button,.lbl-btn{flex:1;padding:12px 8px;border:none;border-radius:8px;font-weight:bold;font-size:13px;cursor:pointer;text-align:center;display:block}
.b-cam{background:#0288d1;color:#fff}
.b-gal{background:#30363d;color:#fff}
.b-auto{background:#00e676;color:#000}
.b-orig{background:#21262d;color:#ffeb3b;border:1px solid #ffeb3b}
.b-save{background:#ff9100;color:#000;font-size:15px;padding:14px}
input[type=file]{display:none}
</style>
</head>
<body>
<div class="top">
    <h1>ТЕРМИНАЛ ОПТИКИ OUKITEL G1</h1>
    <p id="st">Адаптивная авто-фокусировка четкости, контраста и цвета</p>
</div>
<div class="scr">
    <video id="v" autoplay playsinline></video>
    <canvas id="c"></canvas>
</div>
<div class="tel">
    <div>Фокус/Четкость<b id="t1">АВТО</b></div>
    <div>Тени (HDR)<b id="t2">АВТО</b></div>
    <div>Контраст<b id="t3">АВТО</b></div>
    <div>Цветность<b id="t4">АВТО</b></div>
</div>
<div class="ctrl">
    <div class="row">
        <button class="b-cam" onclick="startLiveCam()">📹 ЖИВАЯ КАМЕРА</button>
        <label class="lbl-btn b-gal">🖼️ ФОТО СНЯТЬ/ГАЛЕРЕЯ<input type="file" id="f" accept="image/*"></label>
    </div>
    <div class="row">
        <button class="b-auto" onclick="toggleAuto()" id="btnA">✨ АВТО-УЛУЧШЕНИЕ: ВКЛ</button>
        <button class="b-orig" ontouchstart="autoOn=false;if(mode=='img')drawImg()" ontouchend="autoOn=true;if(mode=='img')drawImg()">👁️ СРАВНИТЬ</button>
    </div>
    <button class="b-save" onclick="save()">💾 СДЕЛАТЬ И СОХРАНИТЬ ЧЕТКИЙ СНИМОК</button>
</div>
<script>
const v=document.getElementById('v'),c=document.getElementById('c'),ctx=c.getContext('2d',{willReadFrequently:true});
let mode='none',img=null,autoOn=true;

function toggleAuto(){
    autoOn=!autoOn;
    document.getElementById('btnA').innerText=autoOn?"✨ АВТО-УЛУЧШЕНИЕ: ВКЛ":"✨ АВТО-УЛУЧШЕНИЕ: ВЫКЛ";
    document.getElementById('btnA').style.background=autoOn?"#00e676":"#555";
    if(mode==='img')drawImg();
}

async function startLiveCam(){
    try{
        const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:1920},height:{ideal:1080}}});
        v.srcObject=s; mode='cam';
        document.getElementById('st').innerText="Живая камера: Авто-анализ в реальном времени";
        requestAnimationFrame(loop);
    }catch(e){
        alert("Для живого потока используйте кнопку правее (Снять/Галерея)");
    }
}

document.getElementById('f').onchange=e=>{
    const file=e.target.files[0]; if(!file)return;
    const i=new Image();
    i.onload=()=>{img=i; mode='img'; drawImg();};
    i.src=URL.createObjectURL(file);
};

function loop(){
    if(mode==='cam' && v.readyState===v.HAVE_ENOUGH_DATA){
        c.width=720; c.height=Math.round(720*(v.videoHeight/v.videoWidth));
        ctx.drawImage(v,0,0,c.width,c.height);
        if(autoOn) processSmartISP();
    }
    if(mode==='cam') requestAnimationFrame(loop);
}

function drawImg(){
    if(!img)return;
    const max=1280; let w=img.width,h=img.height;
    if(w>max||h>max){if(w>h){h=Math.round(h*(max/w));w=max}else{w=Math.round(w*(max/h));h=max}}
    c.width=w; c.height=h;
    ctx.drawImage(img,0,0,w,h);
    if(autoOn) processSmartISP();
}

function processSmartISP(){
    const w=c.width,h=c.height;
    const imgData=ctx.getImageData(0,0,w,h),d=imgData.data;
    let sumL=0,sumS=0,dark=0,minL=255,maxL=0;
    const step=16, samples=(w*h)/4;
    for(let i=0;i<d.length;i+=step){
        const r=d[i],g=d[i+1],b=d[i+2];
        const l=0.299*r+0.587*g+0.114*b;
        sumL+=l; if(l<85)dark++; if(l<minL)minL=l; if(l>maxL)maxL=l;
        const mx=Math.max(r,g,b),mn=Math.min(r,g,b);
        sumS+=mx===0?0:(mx-mn)/mx;
    }
    const avgL=sumL/samples, avgS=sumS/samples, darkR=dark/samples;
    const shBoost=Math.min(0.65,Math.max(0.20,darkR*0.9+(128-avgL)/300));
    const cGain=Math.min(1.40,Math.max(1.12,220/(maxL-minL+40)));
    const sBoost=Math.min(1.65,Math.max(1.20,1.0+(0.45-avgS)*1.3));
    const sharp=2.4;

    document.getElementById('t1').innerText="УЛЬТРА";
    document.getElementById('t2').innerText="+"+Math.round(shBoost*100)+"%";
    document.getElementById('t3').innerText=Math.round(cGain*100)+"%";
    document.getElementById('t4').innerText=Math.round(sBoost*100)+"%";

    const cp=new Uint8ClampedArray(d);
    for(let i=0;i<cp.length;i+=4){
        let r=cp[i],g=cp[i+1],b=cp[i+2];
        r=Math.pow(r/255,1-shBoost*0.48)*255;
        g=Math.pow(g/255,1-shBoost*0.48)*255;
        b=Math.pow(b/255,1-shBoost*0.48)*255;
        r=(r-128)*cGain+128; g=(g-128)*cGain+128; b=(b-128)*cGain+128;
        const gr=0.299*r+0.587*g+0.114*b;
        cp[i]=Math.min(255,Math.max(0,gr+(r-gr)*sBoost));
        cp[i+1]=Math.min(255,Math.max(0,gr+(g-gr)*sBoost));
        cp[i+2]=Math.min(255,Math.max(0,gr+(b-gr)*sBoost));
    }
    for(let y=1;y<h-1;y++){
        for(let x=1;x<w-1;x++){
            const i=(y*w+x)*4,up=((y-1)*w+x)*4,dn=((y+1)*w+x)*4,lf=(y*w+(x-1))*4,rg=(y*w+(x+1))*4;
            for(let k=0;k<3;k++){
                const cnt=cp[i+k], nb=(cp[up+k]+cp[dn+k]+cp[lf+k]+cp[rg+k])*0.25, det=cnt-nb;
                d[i+k]=Math.abs(det)>2?Math.min(255,Math.max(0,cnt+det*sharp)):cnt;
            }
        }
    }
    ctx.putImageData(imgData,0,0);
}

function save(){
    const a=document.createElement('a');
    a.download='OUKITEL_TERMUX_'+Date.now()+'.jpg';
    a.href=c.toDataURL('image/jpeg',0.96);
    a.click();
}
</script>
</body>
</html>
